name: Render deck slides

# Renders every project's real presentation deck to slide images and commits
# them, so the site's slideshow shows the actual slides instead of the text
# rendering. Runs on demand — GitHub's runners can reach Google Drive.
#
# Requires the Drive folder to be shared as "Anyone with the link → Viewer":
#   https://drive.google.com/drive/folders/1L_wC6d70zFuG8VAIq9j6E1BeBQ4GFfWY

on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Project IDs to render (space separated, e.g. "P-01 P-05"). Empty renders all.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and rasteriser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress
          python3 -m pip install --quiet gdown pypdfium2 pillow

      - name: Render decks to slide images
        run: python3 tools/render_slides.py ${{ inputs.projects }}

      - name: Rebuild the deck bundle
        run: python3 tools/build-content.py

      - name: Commit slide images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/slides js/decks.js
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Render project decks to slide images

          Generated by tools/render_slides.py from the source decks in Drive.
          The slideshow now shows each deck's real slides."
          git push origin HEAD:${{ github.ref_name }}
