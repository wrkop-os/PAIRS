<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAIRS — Program for Applied Independent Research in the Summer</title>
<meta name="description" content="PAIRS is a ten-week summer AI/ML research and mentorship program: four mentors, thirty-plus students, and independent projects from fundamentals to final presentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app"></div>

<template id="app-template">
<div style="min-height:100vh;background:#f2f2f3;color:#1d1f20;font-family:Barlow,system-ui,sans-serif">

  <header data-r="header" style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:40px;padding:14px 40px;background:rgba(242,242,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(29,31,32,.16)">
    <div style="display:flex;align-items:center;gap:14px">
      <img data-r="logo" src="uploads/pairs-logo-horizontal.svg" alt="PAIRS" style="height:42px;width:auto;display:block">
      <span data-r="logo-name" class="mono" style="font-size:10px;letter-spacing:.14em;color:#7a7a7d;max-width:150px;line-height:1.35">PROGRAM FOR APPLIED INDEPENDENT RESEARCH IN THE SUMMER</span>
    </div>
    <nav data-r="nav" style="display:flex;gap:34px">
      <button class="tabbtn" data-on="{{ onHome }}" onClick="{{ goHome }}">Home</button>
      <button class="tabbtn" data-on="{{ onMembers }}" onClick="{{ goMembers }}">Members</button>
      <button class="tabbtn" data-on="{{ onProjects }}" onClick="{{ goProjects }}">Projects</button>
      <button class="tabbtn" data-on="{{ onAwards }}" onClick="{{ goAwards }}">Awards</button>
    </nav>
    <span data-r="dates" class="mono" style="font-size:10px;letter-spacing:.16em;color:#7a7a7d">JUN 29 → SEP 04</span>
  </header>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
  <div>

    <section data-r="hero" style="position:relative;height:680px;overflow:hidden;border-bottom:1px solid rgba(29,31,32,.16)">
      <div id="pairs-hero-grid" style="position:absolute;inset:-10% -4%;background-image:linear-gradient(rgba(29,31,32,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,31,32,.07) 1px,transparent 1px);background-size:64px 64px"></div>
      <canvas id="pairs-hero-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
      <div data-r="hero-text" id="pairs-hero-text" style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 40px;pointer-events:none">
        <div style="max-width:640px">
          <img data-r="hero-logo" src="uploads/pairs-logo-stacked.svg" alt="PAIRS" style="height:260px;width:auto;display:block;margin:0 0 22px">
          <h1 data-r="h1" style="font-size:48px;line-height:1.05;letter-spacing:-.01em;margin:0 0 22px">Program for Applied Independent Research in the Summer</h1>
          <p data-r="hero-lede" style="font-size:19px;line-height:1.5;max-width:520px;margin:0 0 28px;color:#424244">10 weeks. Four mentors, 30+ students, 20 projects. You start at machine-learning fundamentals and finish with an independent AI/ML project of your own design, solo or in a group.</p>

        </div>
      </div>
    </section>

    <section data-r="section" style="padding:44px 40px;border-bottom:1px solid rgba(29,31,32,.16)">
      <div data-r="stats" style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="7">
          <div style="padding:0 26px;border-left:1px solid rgba(29,31,32,.16)">
            <div style="display:flex;align-items:baseline;gap:7px">
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:44px;line-height:1;color:#416180">{{ s.num }}</span>
              <span class="mono" style="font-size:11px;letter-spacing:.14em;color:#5d5d60">{{ s.unit }}</span>
            </div>
            <p style="font-size:13.5px;line-height:1.45;color:#5d5d60;margin:8px 0 0">{{ s.label }}</p>
          </div>
        </sc-for>
      </div>
    </section>

    <section data-r="section" style="padding:96px 40px;max-width:1240px;margin:0 auto">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,31,32,.16);padding-bottom:10px;margin-bottom:44px">
        <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#416180;margin:0">01 / FUNDAMENTALS</p>
        <p data-r="meta-right" class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">FOUR DEFINITIONS</p>
      </div>
      <div data-r="two" style="display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start;margin-bottom:56px">
        <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0">What is machine learning?</h2>
        <p data-r="lede" style="font-size:18px;line-height:1.6;color:#424244;margin:0">Instead of writing the rules by hand, you show a program examples and let it work the rules out itself. The four terms below are the pieces of that idea. They cover what the examples look like, how the program measures a wrong answer, and what it changes in response.</p>
      </div>
      <div data-r="grid4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:26px">
        <sc-for list="{{ defs }}" as="d" hint-placeholder-count="4">
          <article class="blueprint" style="padding:26px 22px 24px">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <p class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0 0 14px">{{ d.num }}</p>
            <h3 style="font-size:24px;margin:0 0 10px">{{ d.term }}</h3>
            <p style="font-size:14.5px;line-height:1.55;color:#424244;margin:0">{{ d.body }}</p>
          </article>
        </sc-for>
      </div>
    </section>

    <section data-r="band" style="background:#1d2d3d;color:#f2f2f3;padding:92px 40px">
      <div style="max-width:1240px;margin:0 auto">
        <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(242,242,243,.22);padding-bottom:10px;margin-bottom:44px">
          <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#94bce3;margin:0">02 / A PIPELINE</p>
          <p class="mono" style="font-size:10px;letter-spacing:.18em;color:rgba(242,242,243,.55);margin:0">FIG. 02 · HOW AN ML MODEL IS BUILT</p>
        </div>
        <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0 0 16px;max-width:720px">An ML model's prediction comes out of five steps in a loop.</h2>
        <p style="font-size:17px;line-height:1.6;color:rgba(242,242,243,.72);max-width:600px;margin:0 0 56px">Every project in PAIRS walks this pipeline. Most of the summer is spent going back around it.</p>
        <div data-r="pipeline" style="display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(242,242,243,.22);border:1px solid rgba(242,242,243,.22)">
          <sc-for list="{{ pipeline }}" as="p" hint-placeholder-count="5">
            <div style="background:#1d2d3d;padding:28px 22px 30px;min-height:210px">
              <p class="mono" style="font-size:10px;letter-spacing:.2em;color:#94bce3;margin:0 0 16px">{{ p.step }}</p>
              <h4 style="font-size:21px;margin:0 0 10px;color:#f2f2f3">{{ p.title }}</h4>
              <p style="font-size:14px;line-height:1.55;color:rgba(242,242,243,.68);margin:0">{{ p.body }}</p>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <section data-r="section" style="padding:96px 40px;max-width:1240px;margin:0 auto">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,31,32,.16);padding-bottom:10px;margin-bottom:44px">
        <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#416180;margin:0">03 / CURRICULUM</p>
        <p data-r="meta-right" class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">SPECIALIZATIONS × APPLIED FIELDS</p>
      </div>
      <div data-r="two" style="display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start;margin-bottom:52px">
        <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0">What we teach, and what you cross it with.</h2>
        <p data-r="lede" style="font-size:18px;line-height:1.6;color:#424244;margin:0">A project is one method crossed with one field. Pick a technique you want to understand, pick a domain you care about, and the intersection is your summer.</p>
      </div>
      <div data-r="two" style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
        <div class="blueprint" style="padding:30px 28px 32px">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <p class="mono" style="font-size:10.5px;letter-spacing:.2em;color:#416180;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid rgba(29,31,32,.16)">A · ML SPECIALIZATIONS</p>
          <div style="display:flex;flex-wrap:wrap;gap:9px">
            <sc-for list="{{ methods }}" as="m" hint-placeholder-count="8">
              <span style="border:1px solid rgba(29,31,32,.16);padding:7px 13px;font-size:14px;color:#424244">{{ m }}</span>
            </sc-for>
          </div>
        </div>
        <div class="blueprint" style="padding:30px 28px 32px">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <p class="mono" style="font-size:10.5px;letter-spacing:.2em;color:#416180;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid rgba(29,31,32,.16)">B · APPLIED FIELDS</p>
          <div style="display:flex;flex-wrap:wrap;gap:9px">
            <sc-for list="{{ fields }}" as="f" hint-placeholder-count="8">
              <span style="border:1px solid rgba(29,31,32,.16);padding:7px 13px;font-size:14px;color:#424244">{{ f }}</span>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

  </div>
  </sc-if>

  <sc-if value="{{ isMembers }}" hint-placeholder-val="{{ false }}">
  <div data-r="section-tall" style="padding:76px 40px 110px;max-width:1240px;margin:0 auto">
    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,31,32,.16);padding-bottom:10px;margin-bottom:36px">
      <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#416180;margin:0">01 / MENTORS</p>
      <p data-r="meta-right" class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">ROSTER · 4 ENTRIES</p>
    </div>
    <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0 0 14px">Who you'll work with.</h2>
    <p data-r="lede" style="font-size:18px;line-height:1.6;color:#424244;max-width:620px;margin:0 0 48px">Mentors run every session, review and comment on your work, and are reachable by chat or one-on-one meetings through the week.</p>
    <div data-r="grid4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-bottom:96px">
      <sc-for list="{{ mentors }}" as="m" hint-placeholder-count="4">
        <article class="blueprint mcard" onClick="{{ m.open }}">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="height:250px;border-bottom:1px solid rgba(29,31,32,.16)">
            <image-slot id="{{ m.slotId }}" shape="rect" placeholder="{{ m.slotHint }}" src="{{ m.slotPhoto }}"></image-slot>
          </div>
          <div style="padding:20px 20px 22px">
            <p class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0 0 10px">{{ m.id }}</p>
            <h3 style="font-size:24px;margin:0 0 4px">{{ m.name }}</h3>
            <p class="mono" style="font-size:11px;letter-spacing:.14em;color:#416180;margin:0 0 12px">{{ m.title }}</p>
            <p style="font-size:14px;line-height:1.5;color:#5d5d60;margin:0">{{ m.scope }}</p>
          </div>
        </article>
      </sc-for>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,31,32,.16);padding-bottom:10px;margin-bottom:36px">
      <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#416180;margin:0">02 / STUDENTS</p>
      <p data-r="meta-right" class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">COHORT '26 · {{ studentCount }} ENTRIES</p>
    </div>
    <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0 0 48px">The 2026 cohort.</h2>
    <div data-r="grid5" style="display:grid;grid-template-columns:repeat(5,1fr);gap:22px">
      <sc-for list="{{ students }}" as="s" hint-placeholder-count="19">
        <article class="blueprint mcard" onClick="{{ s.open }}">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="height:150px;border-bottom:1px solid rgba(29,31,32,.16)">
            <image-slot id="{{ s.slotId }}" shape="rect" placeholder="{{ s.slotHint }}" src="{{ s.slotPhoto }}"></image-slot>
          </div>
          <div style="padding:14px 15px 16px">
            <p class="mono" style="font-size:9.5px;letter-spacing:.16em;color:#7a7a7d;margin:0 0 7px">{{ s.id }}</p>
            <h4 style="font-size:18px;margin:0 0 3px">{{ s.name }}</h4>
            <p style="font-size:12.5px;line-height:1.4;color:#5d5d60;margin:0 0 6px">{{ s.track }}</p>
            <sc-if value="{{ s.projectTitle }}" hint-placeholder-val="{{ true }}">
            <p class="mono" style="font-size:10.5px;line-height:1.35;letter-spacing:.04em;color:#416180;margin:0">{{ s.projectTitle }}</p>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </div>
    <p class="mono consent-note" style="font-size:11px;line-height:1.6;letter-spacing:.06em;color:#7a7a7d;max-width:640px;margin:44px 0 0;padding-top:16px;border-top:1px solid rgba(29,31,32,.16)">Only members who gave us consent to be featured on the PAIRS website and social media appear here, so the 2026 cohort was larger than this roster.</p>
  </div>
  </sc-if>

  <sc-if value="{{ isProjects }}" hint-placeholder-val="{{ false }}">
  <div data-r="section-tall" style="padding:76px 40px 110px;max-width:1240px;margin:0 auto">
    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,31,32,.16);padding-bottom:10px;margin-bottom:36px">
      <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#416180;margin:0">01 / PROJECTS</p>
      <p data-r="meta-right" class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">GALLERY · {{ projectCount }} ENTRIES</p>
    </div>
    <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0 0 14px">Everything built here.</h2>
    <p data-r="lede" style="font-size:18px;line-height:1.6;color:#424244;max-width:620px;margin:0 0 40px">Every project produced through PAIRS, with its abstract, its team and the awards it earned. Click a card for the full entry.</p>
    <div style="display:flex;gap:9px;margin-bottom:44px;flex-wrap:wrap">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button class="tag" style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:8px 14px;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }};border-radius:0" onClick="{{ f.pick }}">{{ f.label }}</button>
      </sc-for>
    </div>
    <div data-r="grid3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:26px">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
        <article class="blueprint pcard" onClick="{{ p.open }}">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="height:200px;border-bottom:1px solid rgba(29,31,32,.16);background:#1d2d3d">
            <image-slot id="{{ p.slotId }}" shape="rect" fit="contain" placeholder="{{ p.slotHint }}" src="{{ p.slotPhoto }}"></image-slot>
          </div>
          <div style="padding:22px 22px 24px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
              <p class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">{{ p.id }}</p>
              <p class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">{{ p.year }}</p>
            </div>
            <h3 style="font-size:23px;line-height:1.1;margin:0 0 10px">{{ p.title }}</h3>
            <p style="font-size:14px;line-height:1.5;color:#5d5d60;margin:0 0 16px">{{ p.blurb }}</p>
            <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
              <span style="border:1px solid rgba(29,31,32,.16);padding:4px 9px;font-size:11.5px;color:#5d5d60">{{ p.method }}</span>
              <span style="border:1px solid rgba(29,31,32,.16);padding:4px 9px;font-size:11.5px;color:#5d5d60">{{ p.field }}</span>
            </div>
            <p class="mono" style="font-size:10px;letter-spacing:.14em;color:#416180;margin:0">{{ p.awardLine }}</p>
          </div>
        </article>
      </sc-for>
    </div>
    <p class="mono consent-note" style="font-size:11px;line-height:1.6;letter-spacing:.06em;color:#7a7a7d;max-width:640px;margin:44px 0 0;padding-top:16px;border-top:1px solid rgba(29,31,32,.16)">Only projects whose teams gave us consent to publish on the PAIRS website and social media appear here, so more were completed in 2026 than this gallery shows.</p>
  </div>
  </sc-if>

  <sc-if value="{{ isAwards }}" hint-placeholder-val="{{ false }}">
  <div data-r="section-tall" style="padding:76px 40px 110px;max-width:1240px;margin:0 auto">
    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,31,32,.16);padding-bottom:10px;margin-bottom:36px">
      <p class="mono" style="font-size:11px;letter-spacing:.22em;color:#416180;margin:0">01 / AWARDS</p>
      <p data-r="meta-right" class="mono" style="font-size:10px;letter-spacing:.18em;color:#7a7a7d;margin:0">JURIED BY MENTORS · {{ awardsList.length }} AWARDED</p>
    </div>
    <h2 data-r="h2" style="font-size:46px;line-height:1.05;margin:0 0 14px">Certificates & awards.</h2>
    <p data-r="lede" style="font-size:18px;line-height:1.6;color:#424244;max-width:620px;margin:0 0 48px">Four awards juried by the mentors at the close of the summer, each tied to one project. Click a card to open that project's full entry.</p>
    <div data-r="grid2" style="display:grid;grid-template-columns:repeat(2,1fr);gap:26px">
      <sc-for list="{{ awardsList }}" as="aw" hint-placeholder-count="4">
        <article class="blueprint pcard" onClick="{{ aw.open }}" style="display:flex;align-items:center;gap:26px;padding:28px 30px">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="width:96px;height:96px;flex-shrink:0" class="award-icon-slot">
            <image-slot id="{{ aw.slotId }}" shape="rect" fit="contain" placeholder="Award badge" src="{{ aw.icon }}"></image-slot>
          </div>
          <div>
            <h3 style="font-size:23px;margin:0 0 8px">{{ aw.name }}</h3>
            <p style="font-size:13.5px;line-height:1.5;color:#7a7a7d;margin:0 0 12px">{{ aw.description }}</p>
            <p style="font-size:14.5px;line-height:1.5;color:#5d5d60;margin:0 0 6px">{{ aw.team }}</p>
            <p class="mono" style="font-size:11px;letter-spacing:.1em;color:#416180;margin:0">{{ aw.projectTitle }}</p>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ hasLightbox }}">
  <div data-r="lbwrap" style="position:fixed;inset:0;z-index:300;background:rgba(29,31,32,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px" onClick="{{ closeLightboxHandler }}">
    <div data-r="lbhead" style="display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:1100px;margin-bottom:14px" onClick="{{ stop }}">
      <p class="mono" style="font-size:11px;letter-spacing:.14em;color:#f2f2f3;margin:0;max-width:72%">{{ lightbox.title }}</p>
      <button onClick="{{ closeLightboxHandler }}" class="mono" style="border:1px solid rgba(242,242,243,.4);background:transparent;color:#f2f2f3;font-size:11px;letter-spacing:.1em;padding:8px 14px;cursor:pointer">CLOSE ✕</button>
    </div>
    <div data-r="lbstage" style="position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;background:#f2f2f3" onClick="{{ stop }}">
      <sc-if value="{{ lightbox.hasImage }}">
      <image-slot id="lightbox-slide" shape="rect" fit="contain" placeholder="Slide" src="{{ lightbox.currentImage }}"></image-slot>
      </sc-if>
      <sc-if value="{{ lightbox.hasText }}">
      <article class="slide {{ lightbox.slideClass }}">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <p class="mono slide-n">{{ lightbox.slideKicker }}</p>
        <h3 class="slide-title">{{ lightbox.slideTitle }}</h3>
        <ul class="slide-body">
          <sc-for list="{{ lightbox.slideBody }}" as="line">
            <li>{{ line }}</li>
          </sc-for>
        </ul>
        <p class="mono slide-foot">{{ lightbox.slideFoot }}</p>
      </article>
      </sc-if>
      <button class="lb-nav lb-prev" onClick="{{ lightboxPrevHandler }}" aria-label="Previous slide">‹</button>
      <button class="lb-nav lb-next" onClick="{{ lightboxNextHandler }}" aria-label="Next slide">›</button>
    </div>
    <p class="mono" style="font-size:10px;letter-spacing:.14em;color:rgba(242,242,243,.6);margin:14px 0 0">SLIDE {{ lightbox.position }} / {{ lightbox.total }}</p>
  </div>
  </sc-if>

  <sc-if value="{{ hasDoc }}">
  <div data-r="modalwrap" style="position:fixed;inset:0;z-index:320;background:rgba(29,31,32,.72);display:flex;align-items:center;justify-content:center;padding:40px" onClick="{{ closeDoc }}">
    <div class="blueprint doc-panel" onClick="{{ stop }}">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="doc-head">
        <p class="mono doc-kicker">{{ doc.kicker }}</p>
        <button class="mono btn-close" onClick="{{ closeDoc }}">CLOSE ✕</button>
      </div>
      <h2 class="doc-title">{{ doc.title }}</h2>
      <p class="mono doc-sub">{{ doc.subtitle }}</p>
      <sc-for list="{{ doc.sections }}" as="sec">
        <section class="doc-section">
          <sc-if value="{{ sec.heading }}">
          <h3>{{ sec.heading }}</h3>
          </sc-if>
          <sc-for list="{{ sec.paragraphs }}" as="para">
            <p>{{ para }}</p>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ hasModal }}" hint-placeholder-val="{{ false }}">
  <div data-r="modalwrap" style="position:fixed;inset:0;z-index:200;background:rgba(29,31,32,.55);display:flex;align-items:center;justify-content:center;padding:48px" onClick="{{ closeModal }}">
    <div class="blueprint" data-r="modalpanel" style="background:#f2f2f3;max-width:900px;width:100%;max-height:84vh;overflow:auto" onClick="{{ stop }}">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div data-r="modalhead" style="display:flex;justify-content:space-between;align-items:flex-start;padding:26px 30px 0">
        <p class="mono" style="font-size:10.5px;letter-spacing:.2em;color:#416180;margin:0">{{ modal.kicker }}</p>
        <button class="mono" style="background:none;border:1px solid rgba(29,31,32,.16);font-size:11px;letter-spacing:.14em;padding:6px 12px;cursor:pointer;color:#5d5d60" onClick="{{ closeModal }}">CLOSE ✕</button>
      </div>
      <div data-r="modalbody" style="display:grid;grid-template-columns:300px 1fr;gap:34px;padding:22px 30px 34px">
        <div>
          <div class="{{ modal.photoWrapClass }}" data-r="modalphoto" style="height:300px;background:{{ modal.photoBg }}">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <image-slot id="{{ modal.slotId }}" shape="rect" fit="{{ modal.photoFit }}" placeholder="{{ modal.slotHint }}" src="{{ modal.slotPhoto }}"></image-slot>
          </div>
          <sc-if value="{{ modal.hasMeta }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top:22px;border-top:1px solid rgba(29,31,32,.16);padding-top:16px">
            <sc-for list="{{ modal.meta }}" as="row" hint-placeholder-count="3">
              <div style="display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid rgba(29,31,32,.08)">
                <span class="mono" style="font-size:10px;letter-spacing:.14em;color:#7a7a7d">{{ row.k }}</span><span style="font-size:13.5px;color:#424244;text-align:right">{{ row.v }}</span>
                
              </div>
            </sc-for>
          </div>
          </sc-if>
        </div>
        <div>
          <h2 data-r="modaltitle" style="font-size:38px;line-height:1.05;margin:0 0 6px">{{ modal.title }}</h2>
          <p class="mono" style="font-size:11.5px;letter-spacing:.14em;color:#416180;margin:0 0 22px">{{ modal.subtitle }}</p>
          <p style="font-size:16px;line-height:1.6;color:#424244;margin:0 0 26px">{{ modal.body }}</p>

          <sc-if value="{{ modal.hasAwards }}" hint-placeholder-val="{{ true }}">
          <div style="margin-bottom:26px">
            <p class="mono" style="font-size:10.5px;letter-spacing:.2em;color:#7a7a7d;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid rgba(29,31,32,.16)">CERTIFICATES &amp; AWARDS</p>
            <sc-for list="{{ modal.awards }}" as="a" hint-placeholder-count="2">
              <div class="blueprint" style="display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:9px">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <sc-if value="{{ a.hasIcon }}" hint-placeholder-val="{{ false }}">
                <div style="width:40px;height:40px;flex-shrink:0" class="award-icon-slot">
                  <image-slot id="{{ a.slotId }}" shape="rect" fit="contain" placeholder="Award badge" src="{{ a.icon }}"></image-slot>
                </div>
                </sc-if>
                <sc-if value="{{ a.iconMissing }}" hint-placeholder-val="{{ true }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5980a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg>
                </sc-if>
                <div>
                  <p style="font-size:15px;margin:0;color:#1d1f20">{{ a.name }}</p>
                  <p class="mono" style="font-size:10px;letter-spacing:.14em;color:#7a7a7d;margin:2px 0 0">{{ a.detail }}</p>
                </div>
              </div>
            </sc-for>
          </div>
          </sc-if>

          <sc-if value="{{ modal.hasLinks }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <sc-for list="{{ modal.links }}" as="l" hint-placeholder-count="1">
              <span onClick="{{ l.onClick }}" style="display:inline-flex;align-items:center;gap:8px;border:1px solid #5980a6;background:#5980a6;color:#f2f2f3;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;cursor:pointer;text-decoration:none">{{ l.label }}</span>
            </sc-for>
          </div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
  </sc-if>

  <footer data-r="footer" style="border-top:1px solid rgba(29,31,32,.16);padding:26px 40px 46px;background:#e9e9ea">
    <div class="mono" style="max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:10px;letter-spacing:.16em;color:#7a7a7d">
      <span>PAIRS · PROGRAM FOR APPLIED INDEPENDENT RESEARCH IN THE SUMMER</span>
      <span>JUN 29 – SEP 04</span>
      <span>MON · WED · FRI · ET</span>
    </div>
  </footer>

</div>
</template>

<script src="js/decks.js"></script>
<script src="js/image-slot.js"></script>
<script src="js/dc-runtime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
